# Round-robin load balancer in front of two RateGuard instances.

upstream rateguard {
    server app-a:8080;
    server app-b:8080;
}

server {
    listen 80;

    # Never retry a request on the other instance: the first instance may
    # already have counted it against the client's quota, so a retry would
    # charge one client request twice.
    proxy_next_upstream off;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;

    location /api/ {
        proxy_pass http://rateguard;
    }

    # Only health probes are public; metrics stay inside the Docker network.
    location /actuator/health {
        proxy_pass http://rateguard;
    }

    location /actuator/ {
        return 404;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
