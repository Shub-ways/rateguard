# RateGuard distributed demo: Redis + two app instances + nginx load balancer.
#
#   mvn -DskipTests package                 # builds rateguard-service/target/*.jar
#   copy .env.example .env  (then edit the keys)   OR   set RATEGUARD_API_KEYS in your shell
#   docker compose up --build -d
#   ./scripts/verify-shared-quota.ps1
#   docker compose down
#
# Only the proxy publishes a port (8080). Redis and the app instances are
# reachable only on the internal "backend" network.

name: rateguard

x-app: &app
  build:
    context: ./rateguard-service
  image: rateguard-service:local
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  networks: [backend]
  healthcheck:
    # The JRE image has no curl; bash's /dev/tcp is enough to probe readiness.
    test:
      - CMD-SHELL
      - >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
        grep -q "\"UP\"" <&3'
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

x-app-env: &app-env
  RATEGUARD_BACKEND: REDIS
  RATEGUARD_ALGORITHM: ${RATEGUARD_ALGORITHM:-FIXED_WINDOW}
  RATEGUARD_LIMIT: ${RATEGUARD_LIMIT:-5}
  RATEGUARD_WINDOW: ${RATEGUARD_WINDOW:-60s}
  RATEGUARD_REDIS_FAILUREMODE: ${RATEGUARD_REDIS_FAILUREMODE:-FAIL_CLOSED}
  # Required; taken from your shell or a git-ignored .env file, never from this repo.
  RATEGUARD_API_KEYS: ${RATEGUARD_API_KEYS:?Set RATEGUARD_API_KEYS in your shell or in .env (see .env.example)}
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  redis:
    image: redis:7.4.2-alpine
    # Rate-limit state is short-lived and TTL-bound: no persistence, bounded memory,
    # and under memory pressure evict the keys closest to expiring anyway.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  app-a:
    <<: *app
    environment:
      <<: *app-env
      RATEGUARD_INSTANCEID: app-a

  app-b:
    <<: *app
    environment:
      <<: *app-env
      RATEGUARD_INSTANCEID: app-b

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [frontend, backend]

networks:
  frontend: {}
  backend:
    internal: true   # no route to the outside world; only the proxy bridges in
