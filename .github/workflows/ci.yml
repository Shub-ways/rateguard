name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (JDK 25, Docker for Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Tool versions
        run: |
          java -version
          mvn -v
          docker version --format 'Docker {{.Server.Version}}'

      - name: mvn clean test
        run: mvn -B -ntp clean test

      # Skipped tests are not passed tests: the Testcontainers suites skip themselves
      # when Docker is missing, so CI fails if anything was skipped.
      - name: Require every test to run and pass
        if: always()
        shell: python
        run: |
          import glob, sys, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True):
              s = ET.parse(path).getroot()
              tests += int(s.get("tests", 0)); failures += int(s.get("failures", 0))
              errors += int(s.get("errors", 0)); skipped += int(s.get("skipped", 0))
          summary = f"Tests run: {tests}, failures: {failures}, errors: {errors}, skipped: {skipped}"
          print(summary)
          # A notice annotation is publicly readable via the checks API (logs need a login).
          print(f"::notice title=Test totals::{summary}")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {summary}\n")
          if tests == 0 or failures or errors or skipped:
              sys.exit("Every test must run and pass (no failures, errors or skips).")

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 14
