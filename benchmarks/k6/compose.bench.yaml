# Benchmark topology. All services and the k6 client share one Docker network,
# so every scenario has the same client environment (no host port forwarding).
# Driven by benchmarks/k6/run-k6.ps1; see docs/BENCHMARKS.md for the method.
#
#   profile "single":       redis + app            (scenarios A, B, C)
#   profile "distributed":  redis + app-a + app-b + proxy (scenario D, correctness)
#   profile "tools":        k6 (used with `docker compose run`)

name: rateguard-bench

x-app: &app
  image: rateguard-service:local   # built by the main compose.yaml (docker compose build)
  networks: [bench]
  cpus: 2
  mem_limit: 1g
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
        grep -q "\"UP\"" <&3'
    interval: 3s
    timeout: 3s
    retries: 30
    start_period: 15s

x-app-env: &app-env
  RATEGUARD_ENABLED: ${RG_ENABLED:-true}
  RATEGUARD_BACKEND: ${RG_BACKEND:-IN_MEMORY}
  RATEGUARD_ALGORITHM: FIXED_WINDOW
  RATEGUARD_LIMIT: ${RG_LIMIT:-1000000000}
  RATEGUARD_WINDOW: ${RG_WINDOW:-60s}
  RATEGUARD_REDIS_FAILUREMODE: FAIL_CLOSED
  RATEGUARD_API_KEYS: ${RG_API_KEYS:?RG_API_KEYS is generated by run-k6.ps1}
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    cpus: 1
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [bench]

  app:
    <<: *app
    profiles: [single]
    environment:
      <<: *app-env
      RATEGUARD_INSTANCEID: app

  app-a:
    <<: *app
    profiles: [distributed]
    environment:
      <<: *app-env
      RATEGUARD_INSTANCEID: app-a

  app-b:
    <<: *app
    profiles: [distributed]
    environment:
      <<: *app-env
      RATEGUARD_INSTANCEID: app-b

  proxy:
    image: nginx:1.27-alpine
    profiles: [distributed]
    cpus: 1
    volumes:
      - ../../deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [bench]

  k6:
    image: grafana/k6:1.4.0
    profiles: [tools]
    cpus: 4
    networks: [bench]
    volumes:
      - ./:/scripts:ro
      - ../results/k6:/results

networks:
  bench: {}
